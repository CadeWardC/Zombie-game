name: Test & build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot"

      - name: Import project
        run: timeout 300 "$HOME/godot" --headless --import || true

      - name: Compile check (every script loads)
        run: timeout 120 "$HOME/godot" --headless res://tests/compile_check.tscn
      - name: Smoke test
        run: timeout 600 "$HOME/godot" --headless res://tests/smoke_test.tscn

      - name: Multiplayer test (host and guest on one machine)
        run: timeout 400 tests/run_net_test.sh "$HOME/godot"

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -f templates.tpz godot.zip

      - name: Configure Android SDK and debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # Let Godot create its editor settings, then point them at the
          # runner's preinstalled Android SDK and Java.
          timeout 300 "$HOME/godot" --headless --import || true
          SETTINGS="$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
          } >> "$SETTINGS"

      - name: Export debug APK
        run: |
          mkdir -p build/android
          timeout 600 "$HOME/godot" --headless --export-debug "Android" build/android/ZombieSurvival-debug.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: ZombieSurvival-debug-apk
          path: build/android/ZombieSurvival-debug.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/ios*' 'templates/version.txt'
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          mv templates/* "$TPL/"
          rm -f templates.tpz godot.zip

      - name: Export Xcode project
        run: |
          "$GODOT" --headless --import || true
          mkdir -p build/ios
          "$GODOT" --headless --export-release "iOS" build/ios/ZombieSurvival.ipa
          ls -la build/ios

      - name: Build unsigned app
        run: |
          PROJ=$(find build/ios -maxdepth 1 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ  Scheme: $SCHEME"
          # Wi-Fi multiplayer: iOS asks the player for local network access.
          for PLIST in $(find build/ios -maxdepth 2 -name "*-Info.plist"); do
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Find and join friends playing on the same Wi-Fi.'" "$PLIST" || true
            echo "Updated $PLIST"
          done
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build/ios/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" build | tail -40

      - name: Package .ipa
        run: |
          APP=$(find build/ios/dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "App: $APP"
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/
          (cd build/ios && zip -qr ZombieSurvival-unsigned.ipa Payload)
          ls -la build/ios/ZombieSurvival-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ZombieSurvival-unsigned-ipa
          path: build/ios/ZombieSurvival-unsigned.ipa
